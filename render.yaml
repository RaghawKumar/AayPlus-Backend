# Backend repository root. If using a workspace/monorepo, set rootDir: AayPlus-Backend.
services:
  - type: web
    name: aayplus-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.6
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://aayplus-admin.netlify.app,http://localhost:3000,http://localhost:7357
      # Temporary shared-code login. Set STATIC_OTP_CODE in Render; disable this
      # mode before real users join (AUTH_OTP_MODE=default).
      - key: AUTH_OTP_MODE
        value: static
      - key: STATIC_OTP_CODE
        sync: false
      - key: SUPABASE_LISTING_BUCKET
        value: listing-images
      - key: SUPABASE_EVIDENCE_BUCKET
        value: inspection-evidence
